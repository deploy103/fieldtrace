[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fieldtrace-ctf"
version = "0.1.0"
description = "Offline Korean CLI for CTF packet and log evidence analysis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "FieldTrace contributors" }]
dependencies = [
  "python-evtx>=0.8.1",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.scripts]
fieldtrace = "fieldtrace.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fieldtrace"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a real external tool such as TShark",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
